<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tin Tức - Video</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:#fff;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
.page{
  max-width:900px;
  margin:auto;
  padding:20px 16px 50px;
}
h1{font-size:30px;margin:10px 0 20px}
.article{
  margin-top:20px;
}
.article-title{
  font-size:28px;
  font-weight:800;
  line-height:1.2;
  margin:15px 0;
}
.article-text{
  font-size:18px;
  line-height:1.6;
}

/* POPUP QUẢNG CÁO */
#adOverlay{
  position:fixed;
  inset:0;
  z-index:99999;
  background:rgba(0,0,0,.82);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
#adBox{
  position:relative;
  width:min(92vw,600px);
}
#adBox img{
  display:block;
  width:100%;
  height:auto;
  border-radius:16px;
  box-shadow:0 10px 40px rgba(0,0,0,.65);
}
#closeAd{
  position:absolute;
  right:-10px;
  top:-18px;
  width:54px;
  height:54px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#555;
  font-size:42px;
  font-weight:bold;
  line-height:50px;
  text-align:center;
  text-decoration:none;
  z-index:10;
  cursor:pointer;
}
#continueBox{
  display:none;
  margin-top:20px;
  text-align:center;
}
#continueBtn{
  display:inline-block;
  width:100%;
  max-width:500px;
  padding:17px 20px;
  border:0;
  border-radius:12px;
  background:#1667ff;
  color:#fff;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 5px 18px rgba(0,0,0,.25);
}
#continueBtn:active{transform:scale(.98)}

.video-section{
  display:none;
  margin-top:30px;
}
.video-section.show{display:block}
.video-title{
  font-size:25px;
  font-weight:800;
  margin:0 0 12px;
}
video{
  width:100%;
  max-height:75vh;
  display:block;
  background:#000;
  border-radius:10px;
}
.note{
  margin-top:10px;
  color:#666;
  font-size:14px;
}
</style>
</head>

<body>

<div class="page">

  <h1>Tin Tức Đường Phố</h1>

  <div class="article">
    <div class="article-title">Tin tức mới nhất</div>
    <div class="article-text">
      Nội dung bài viết của bạn ở đây.
    </div>

    <div id="videoSection" class="video-section">
      <div class="video-title">Video</div>

      <video id="mainVideo"
             controls
             playsinline
             preload="metadata">
        <source
          src="https://www.image2url.com/r2/default/videos/1788243750857-2f9f3c74-032d-45fa-af63-040b3345843a.mp4"
          type="video/mp4">
        Trình duyệt không hỗ trợ video.
      </video>

      <div class="note">
        Nếu video không tự phát âm thanh, hãy bấm nút loa trong trình phát video.
      </div>
    </div>
  </div>
</div>

<!-- QUẢNG CÁO -->
<div id="adOverlay">
  <div id="adBox">

    <!-- Bấm X: mở Shopee -->
    <a id="closeAd"
       href="https://s.shopee.vn/3qMlWZaBkP"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Đóng quảng cáo và mở Shopee">×</a>

    <a href="https://s.shopee.vn/3qMlWZaBkP"
       target="_blank"
       rel="noopener noreferrer">
      <img
        src="https://cdn.phototourl.com/free/2026-09-01-857865cd-565f-46ac-a40e-60a1bd475fe6.jpg"
        alt="Quảng cáo Shopee">
    </a>

  </div>
</div>

<!-- NÚT TIẾP TỤC -->
<div id="continueBox">
  <button id="continueBtn">
    ▶ TIẾP TỤC XEM VIDEO
  </button>
</div>

<script>
(function(){

  const adOverlay = document.getElementById("adOverlay");
  const closeAd = document.getElementById("closeAd");
  const continueBox = document.getElementById("continueBox");
  const continueBtn = document.getElementById("continueBtn");
  const videoSection = document.getElementById("videoSection");
  const video = document.getElementById("mainVideo");

  /*
   * sessionStorage:
   * adClosed = đã đóng quảng cáo trong phiên
   * shopeeDone = đã bấm X để mở Shopee
   * tiktokDone = đã bấm Tiếp tục để mở TikTok
   * videoUnlocked = đã mở khóa video
   */

  function showContinue(){
    adOverlay.style.display = "none";
    continueBox.style.display = "block";
  }

  function unlockVideo(){
    continueBox.style.display = "none";
    videoSection.classList.add("show");
    sessionStorage.setItem("videoUnlocked","1");
  }

  // Nếu người đọc đã đi qua quảng cáo trong cùng phiên
  if(sessionStorage.getItem("adClosed") === "1"){
    adOverlay.style.display = "none";

    if(sessionStorage.getItem("videoUnlocked") === "1"){
      videoSection.classList.add("show");
    }else{
      continueBox.style.display = "block";
    }
  }

  // Bấm X: lưu trạng thái rồi mở Shopee
  closeAd.addEventListener("click", function(){
    sessionStorage.setItem("adClosed","1");
    sessionStorage.setItem("shopeeDone","1");

    // Cho phép trang phía sau sẵn sàng khi người dùng quay lại.
    adOverlay.style.display = "none";
    continueBox.style.display = "block";
  });

  // Bấm "Tiếp tục xem video": lưu trạng thái rồi mở TikTok
  continueBtn.addEventListener("click", function(){

    sessionStorage.setItem("tiktokDone","1");

    /*
     * Mở TikTok trong tab/cửa sổ mới.
     * Trên iPhone, nếu TikTok đã cài, Safari có thể chuyển sang app.
     */
    const tiktokUrl = "https://vt.tiktok.com/ZS9BQgahS3qTt-stnQI/";
    window.open(tiktokUrl, "_blank");

    // Video được mở khóa ngay sau thao tác.
    unlockVideo();
  });

})();
</script>

</body>
</html>
