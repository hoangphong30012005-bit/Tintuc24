<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nút X mở Shopee</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
}

.ad-box {
  position: relative;
  width: 300px;
  height: 300px;
  background: #333;
  border-radius: 16px;
}

.shopee-close {
  position: absolute;
  right: -10px;
  top: -18px;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: #fff;
  color: #555;
  font-size: 42px;
  font-weight: bold;
  line-height: 50px;
  text-align: center;
  text-decoration: none;
  z-index: 10;
}
</style>
</head>

<body>

<div class="ad-box">

  <a
    class="shopee-close"
    href="https://s.shopee.vn/3qMlWZaBkP"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Mở Shopee">
    ×
  </a>

</div>

</body>
</html>
