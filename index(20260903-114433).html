<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tin Tức</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f4f6f8;color:#263640;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:21px;color:#087f88}
.header-actions{display:flex;gap:7px}
.header button{border:0;background:#eef3f4;border-radius:10px;padding:9px 12px}
.container{max-width:760px;margin:auto;padding:18px 12px 70px}
.page{display:none}.page.active{display:block}
h1{font-size:28px;margin:8px 0 8px}
h2{margin:0 0 8px}
.note{font-size:14px;color:#71808a;margin-bottom:16px}
.post-list{display:flex;flex-direction:column;gap:12px}
.post-card{background:#fff;border:1px solid #d3dde2;border-radius:13px;padding:10px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.post-thumb{width:105px;height:78px;border-radius:9px;object-fit:cover;background:#eef1f3;flex:none}
.post-main{min-width:0;flex:1}
.post-title{font-size:18px;font-weight:650;line-height:1.25;word-break:break-word}
.post-meta{font-size:13px;color:#71808a;margin-top:7px}
.read-btn{border:0;border-radius:10px;background:#078a96;color:#fff;padding:9px 12px;margin-top:9px;font-weight:650}
.login{max-width:420px;margin:50px auto;background:#fff;border:1px solid #d9e1e5;border-radius:16px;padding:18px}
.form-card{background:#fff;border:1px solid #d9e1e5;border-radius:16px;padding:16px;margin-bottom:13px}
label{display:block;font-weight:650;margin:12px 0 6px}
input,textarea{width:100%;padding:11px 12px;border:1px solid #ccd7dc;border-radius:10px;outline:none;background:#fff}
textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 12px;background:#edf2f4;color:#263640}
.btn.primary{background:#078a96;color:#fff}.btn.danger{background:#ffe8e8;color:#a61b1b}.btn.orange{background:#fff0df;color:#9a4e00}
.admin-item{background:#fff;border:1px solid #d5dfe3;border-radius:13px;padding:11px;margin:10px 0}
.admin-top{display:flex;gap:11px}
.admin-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.video-item{border:1px solid #d9e1e5;border-radius:12px;padding:10px;margin:9px 0;background:#fafcfc}
.video-head{display:flex;gap:7px;align-items:center}
.video-head input{flex:1}
.preview{width:100%;max-height:220px;object-fit:contain;border-radius:11px;margin-top:8px;background:#f1f3f4}
.fab{position:fixed;right:18px;bottom:22px;width:58px;height:58px;border:0;border-radius:50%;background:#ff5722;color:#fff;font-size:34px;box-shadow:0 5px 18px rgba(0,0,0,.25);z-index:25}
.reader-article{background:#fff;border:1px solid #d9e1e5;border-radius:16px;padding:14px;margin-top:15px}
.reader-article img.cover{width:100%;max-height:280px;object-fit:cover;border-radius:12px}
.reader-article h2{font-size:24px;margin-top:13px}
.video-wrap{margin-top:14px}
.video-wrap b{display:block;margin-bottom:7px}
.video{display:block;width:100%;border-radius:12px;background:#000}
.back-btn{border:0;background:#edf2f4;border-radius:10px;padding:9px 12px;margin-bottom:10px}

/* Quảng cáo phủ màn hình */
.ad-overlay{
 position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.78);
 display:none;align-items:center;justify-content:center;padding:18px;
}
.ad-overlay.show{display:flex}
.ad-box{
 position:relative;width:min(94vw,520px);max-height:88vh;background:#fff;
 border-radius:25px;padding:9px;box-shadow:0 12px 45px rgba(0,0,0,.5);
}
.ad-image{
 display:block;width:100%;max-height:82vh;object-fit:contain;border-radius:18px;
}
.ad-close{
 position:absolute;right:-8px;top:-14px;width:48px;height:48px;border:0;
 border-radius:50%;background:#111;color:#fff;font-size:32px;line-height:1;
 box-shadow:0 3px 12px rgba(0,0,0,.35)
}
.after-return{
 position:fixed;left:12px;right:12px;bottom:18px;z-index:110;
 display:none;background:#078a96;color:#fff;border-radius:13px;padding:13px;
 text-align:center;font-weight:700;box-shadow:0 5px 20px rgba(0,0,0,.25)
}
.after-return.show{display:block}
.empty{text-align:center;color:#73818a;padding:35px 10px}
@media(max-width:600px){
 .post-card{align-items:flex-start}
 .post-main{min-width:0}
 .header{padding-top:calc(10px + env(safe-area-inset-top))}
 .container{padding-bottom:90px}
}
</style>
</head>
<body>

<header class="header">
  <div class="brand">TIN TỨC</div>
  <div class="header-actions">
    <button onclick="showReader()">Trang đọc</button>
    <button onclick="openLogin()">Quản lý</button>
  </div>
</header>

<main class="container">

<section id="readerPage" class="page active">
  <h1>Tin tức mới nhất</h1>
  <div class="note">Bấm vào tin → hiện quảng cáo → bấm X → mở Shopee → quay lại trình duyệt → tự hiện video.</div>
  <div id="readerList" class="post-list"></div>
</section>

<section id="loginPage" class="page">
  <div class="login">
    <h2>🔐 Quản lý</h2>
    <div class="note">Đăng nhập để thêm và sửa tin.</div>
    <input id="passwordInput" type="password" placeholder="Mật khẩu">
    <button class="btn primary" style="width:100%;margin-top:12px" onclick="login()">Đăng nhập</button>
    <div id="loginError" class="note" style="margin-top:10px"></div>
  </div>
</section>

<section id="adminPage" class="page">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <div>
      <h1>Quản lý bài viết</h1>
      <div class="note">Tạo tin mới không làm mất tin cũ.</div>
    </div>
    <button class="btn primary" onclick="newPost()">＋ Tin mới</button>
  </div>
  <div id="adminList"></div>
</section>

<section id="editorPage" class="page">
  <div class="form-card">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
      <h2 id="editorTitle">Tạo tin mới</h2>
      <button class="btn" onclick="openAdmin()">← Quay lại</button>
    </div>

    <label>Tiêu đề tin</label>
    <input id="fTitle" placeholder="Ví dụ: Chi tiết mới nhất...">

    <label>Ảnh đại diện tin</label>
    <input id="fThumb" placeholder="URL ảnh JPG/PNG">
    <div id="thumbPreview"></div>

    <label>Ảnh quảng cáo hiện khi người đọc mở tin</label>
    <input id="fAd" placeholder="URL ảnh quảng cáo">
    <div id="adPreview"></div>

    <label>Link Shopee sau khi bấm X</label>
    <input id="fShop" placeholder="https://s.shopee.vn/...">

    <label>Nội dung tin</label>
    <textarea id="fDesc" placeholder="Nội dung bài viết..."></textarea>

    <label>Video của tin</label>
    <div id="videoEditor"></div>
    <button class="btn orange" onclick="addVideo()">＋ Thêm video</button>

    <div style="display:flex;gap:8px;margin-top:18px">
      <button class="btn primary" onclick="savePost()">💾 Lưu tin</button>
      <button class="btn" onclick="openAdmin()">Hủy</button>
    </div>
  </div>
</section>

</main>

<button class="fab" onclick="newPost()">+</button>

<!-- Quảng cáo -->
<div id="adOverlay" class="ad-overlay">
  <div class="ad-box">
    <button class="ad-close" aria-label="Đóng" onclick="closeAdAndOpenShop()">×</button>
    <img id="adImage" class="ad-image" alt="Quảng cáo">
  </div>
</div>

<div id="returnMessage" class="after-return">🎬 Đã quay lại — đang hiện video của tin này</div>

<script>
const ADMIN_PASSWORD = "hoang2005@";
const STORAGE_KEY = "TIN_TUC_MULTI_POSTS_V2";

const DEFAULT_AD = "https://cdn.phototourl.com/free/2026-09-01-8b75257c-815d-42e5-9fa2-bcf0ae019810.jpg";
const DEFAULT_SHOP = "https://s.shopee.vn/1A02Az3dp";
const DEFAULT_VIDEO = "https://www.image2url.com/r2/default/videos/1788243750857-2f9f3c74-032d-45fa-af63-040b3345843a.mp4";

let posts = load();
let editingId = null;
let pendingPostId = null;

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(Array.isArray(x)) return x;
  }catch(e){}
  return [{
    id:"post-"+Date.now(),
    title:"Tin mới nhất",
    thumb:DEFAULT_AD,
    ad:DEFAULT_AD,
    shop:DEFAULT_SHOP,
    desc:"Nội dung bài viết mới nhất.",
    created:Date.now(),
    videos:[
      {name:"Video 1",url:DEFAULT_VIDEO},
      {name:"Video 2",url:DEFAULT_VIDEO}
    ]
  }];
}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(posts))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(t){return new Date(t).toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"})}
function go(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}
function showReader(){renderReader();go("readerPage")}
function openLogin(){go("loginPage");setTimeout(()=>document.getElementById("passwordInput").focus(),50)}
function login(){
  if(document.getElementById("passwordInput").value===ADMIN_PASSWORD){
    document.getElementById("passwordInput").value="";
    document.getElementById("loginError").textContent="";
    openAdmin();
  }else document.getElementById("loginError").textContent="❌ Mật khẩu không đúng.";
}
function openAdmin(){renderAdmin();go("adminPage")}

function renderReader(){
  const box=document.getElementById("readerList");
  const arr=[...posts].sort((a,b)=>b.created-a.created);
  if(!arr.length){box.innerHTML='<div class="empty">Chưa có tin.</div>';return}
  box.innerHTML=arr.map(p=>`
    <article class="post-card">
      ${p.thumb?`<img class="post-thumb" src="${esc(p.thumb)}" alt="" onerror="this.style.visibility='hidden'">`:`<div class="post-thumb"></div>`}
      <div class="post-main">
        <div class="post-title">${esc(p.title)}</div>
        <div class="post-meta">${fmt(p.created)} · ${p.videos.length} video</div>
        <button class="read-btn" onclick="openPost('${p.id}')">▶ Xem tin</button>
      </div>
    </article>
  `).join("");
}

function openPost(id){
  const p=posts.find(x=>x.id===id);
  if(!p)return;
  pendingPostId=p.id;
  sessionStorage.setItem("pendingPostId",p.id);

  if(p.ad){
    document.getElementById("adImage").src=p.ad;
    document.getElementById("adOverlay").classList.add("show");
  }else{
    showVideos(p.id);
  }
}

function closeAdAndOpenShop(){
  const id=pendingPostId || sessionStorage.getItem("pendingPostId");
  const p=posts.find(x=>x.id===id);
  document.getElementById("adOverlay").classList.remove("show");
  if(!p)return;

  // Lưu đúng bài để khi quay lại Safari biết phải hiện video nào.
  sessionStorage.setItem("pendingPostId",p.id);
  sessionStorage.setItem("returnFromShop","1");

  if(p.shop){
    // Trên iPhone: URL Shopee có thể được iOS/Shopee chuyển sang app.
    window.location.href=p.shop;
  }else{
    showVideos(p.id);
  }
}

function showVideos(id){
  const p=posts.find(x=>x.id===id);
  if(!p)return;

  const old=document.getElementById("readerArticle");
  if(old)old.remove();

  const article=document.createElement("article");
  article.id="readerArticle";
  article.className="reader-article";
  article.innerHTML=`
    <button class="back-btn" onclick="this.parentElement.remove()">← Quay lại danh sách tin</button>
    ${p.thumb?`<img class="cover" src="${esc(p.thumb)}" alt="" onerror="this.style.display='none'">`:``}
    <h2>${esc(p.title)}</h2>
    <div class="note">${fmt(p.created)}</div>
    <p>${esc(p.desc||"")}</p>
    ${p.videos.map((v,i)=>`
      <div class="video-wrap">
        <b>${esc(v.name||("Video "+(i+1)))}</b>
        <video class="video" controls playsinline webkit-playsinline preload="metadata">
          <source src="${esc(v.url)}">
        </video>
      </div>`).join("")}
  `;
  document.getElementById("readerPage").appendChild(article);
  article.scrollIntoView({behavior:"smooth"});
}

function checkReturnFromShop(){
  const id=sessionStorage.getItem("pendingPostId");
  const flag=sessionStorage.getItem("returnFromShop");
  if(flag==="1" && id){
    const p=posts.find(x=>x.id===id);
    sessionStorage.removeItem("returnFromShop");
    if(p){
      showReader();
      showVideos(id);
      const msg=document.getElementById("returnMessage");
      msg.classList.add("show");
      setTimeout(()=>msg.classList.remove("show"),2600);
    }
  }
}

// Khi quay lại Safari sau khi rời trang.
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible") setTimeout(checkReturnFromShop,250);
});
window.addEventListener("pageshow",()=>setTimeout(checkReturnFromShop,250));

function renderAdmin(){
  const box=document.getElementById("adminList");
  const arr=[...posts].sort((a,b)=>b.created-a.created);
  if(!arr.length){box.innerHTML='<div class="empty">Chưa có tin.</div>';return}
  box.innerHTML=arr.map(p=>`
    <div class="admin-item">
      <div class="admin-top">
        ${p.thumb?`<img class="post-thumb" src="${esc(p.thumb)}" alt="">`:`<div class="post-thumb"></div>`}
        <div style="flex:1;min-width:0">
          <div class="post-title">${esc(p.title)}</div>
          <div class="post-meta">${fmt(p.created)} · ${p.videos.length} video</div>
        </div>
      </div>
      <div class="admin-actions">
        <button class="btn primary" onclick="editPost('${p.id}')">✏️ Sửa</button>
        <button class="btn" onclick="duplicatePost('${p.id}')">⧉ Nhân bản</button>
        <button class="btn danger" onclick="deletePost('${p.id}')">🗑 Xóa</button>
      </div>
    </div>
  `).join("");
}

function newPost(){
  editingId=null;
  document.getElementById("editorTitle").textContent="＋ Tạo tin mới";
  ["fTitle","fThumb","fAd","fShop","fDesc"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("videoEditor").innerHTML="";
  addVideo("Video 1","");
  updatePreview();
  go("editorPage");
}
function editPost(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  editingId=id;
  document.getElementById("editorTitle").textContent="✏️ Sửa tin";
  document.getElementById("fTitle").value=p.title||"";
  document.getElementById("fThumb").value=p.thumb||"";
  document.getElementById("fAd").value=p.ad||"";
  document.getElementById("fShop").value=p.shop||"";
  document.getElementById("fDesc").value=p.desc||"";
  document.getElementById("videoEditor").innerHTML="";
  (p.videos||[]).forEach(v=>addVideo(v.name,v.url));
  updatePreview();
  go("editorPage");
}
function addVideo(name="",url=""){
  const box=document.getElementById("videoEditor");
  const n=box.children.length+1;
  const row=document.createElement("div");
  row.className="video-item";
  row.innerHTML=`
    <div class="video-head">
      <input class="v-name" value="${esc(name||("Video "+n))}" placeholder="Tên video">
      <button class="btn danger" onclick="this.closest('.video-item').remove();renumber()">Xóa</button>
    </div>
    <label style="font-size:13px">URL video</label>
    <input class="v-url" value="${esc(url)}" placeholder="https://...mp4">
  `;
  box.appendChild(row);
}
function renumber(){
  [...document.querySelectorAll(".video-item")].forEach((r,i)=>{
    const x=r.querySelector(".v-name");
    if(!x.value.trim())x.value="Video "+(i+1);
  });
}
function savePost(){
  const title=document.getElementById("fTitle").value.trim()||"Tin chưa đặt tên";
  const thumb=document.getElementById("fThumb").value.trim();
  const ad=document.getElementById("fAd").value.trim();
  const shop=document.getElementById("fShop").value.trim();
  const desc=document.getElementById("fDesc").value.trim();
  const videos=[...document.querySelectorAll(".video-item")].map((r,i)=>({
    name:r.querySelector(".v-name").value.trim()||"Video "+(i+1),
    url:r.querySelector(".v-url").value.trim()
  })).filter(v=>v.url);

  if(!videos.length){alert("Hãy thêm ít nhất 1 URL video.");return}

  if(editingId){
    const p=posts.find(x=>x.id===editingId);
    Object.assign(p,{title,thumb,ad,shareImage,shop,desc,videos});
  }else{
    posts.push({
      id:"post-"+Date.now()+"-"+Math.random().toString(36).slice(2),
      title,thumb,ad,shop,desc,videos,created:Date.now()
    });
  }
  persist();
  alert(editingId?"Đã lưu bài viết.":"Đã tạo tin mới. Tin cũ vẫn được giữ nguyên.");
  openAdmin();
}
function duplicatePost(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  const copy=JSON.parse(JSON.stringify(p));
  copy.id="post-"+Date.now()+"-"+Math.random().toString(36).slice(2);
  copy.title=p.title+" - Tin mới";
  copy.created=Date.now();
  posts.push(copy);persist();renderAdmin();
}
function deletePost(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  if(!confirm("Xóa tin này khỏi danh sách?"))return;
  posts=posts.filter(x=>x.id!==id);persist();renderAdmin();
}
function updatePreview(){
  const t=document.getElementById("fThumb").value.trim();
  const a=document.getElementById("fAd").value.trim();
  document.getElementById("thumbPreview").innerHTML=t?`<img class="preview" src="${esc(t)}" alt="">`:"";
  document.getElementById("adPreview").innerHTML=a?`<img class="preview" src="${esc(a)}" alt="">`:"";
}
["fThumb","fAd"].forEach(id=>document.getElementById(id).addEventListener("input",updatePreview));

renderReader();
</script>
</body>
</html>
