<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Không ngờ luôn</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial,sans-serif}
.page{max-width:760px;margin:0 auto;background:#111;min-height:100vh;padding-bottom:30px}
h1{font-size:25px;line-height:1.3;padding:18px 16px 8px;margin:0}
.article{padding:0 16px}
video{display:block;width:100%;height:auto;max-height:80vh;background:#000;border-radius:10px}
.note{color:#ccc;font-size:14px;line-height:1.5;margin-top:14px}
.play-btn{display:none;width:100%;border:0;border-radius:10px;padding:14px;margin-top:12px;background:#fff;color:#111;font-size:17px;font-weight:bold}
</style>
</head>
<body>
<div class="page">
  <h1>Không ngờ luôn 😱</h1>
  <div class="article">
    <video id="backgroundVideo" controls playsinline preload="metadata">
      <source src="https://www.image2url.com/r2/default/videos/1788243750857-2f9f3c74-032d-45fa-af63-040b3345843a.mp4" type="video/mp4">
      Trình duyệt của bạn không hỗ trợ video.
    </video>

    <button id="playBtn" class="play-btn">▶ Tiếp tục xem video</button>
    <p class="note">Video sẽ nhớ vị trí đang xem khi bạn chuyển sang quảng cáo.</p>
  </div>
</div>

<script>
(function(){
  const video = document.getElementById('backgroundVideo');
  const playBtn = document.getElementById('playBtn');
  const KEY = 'tintuc24_video_time';

  function saveTime(){
    if (video && isFinite(video.currentTime)) {
      localStorage.setItem(KEY, String(video.currentTime));
    }
  }

  function restoreTime(){
    const saved = parseFloat(localStorage.getItem(KEY) || '0');
    if (saved > 0 && isFinite(saved)) {
      const set = function(){
        try {
          if (saved < video.duration) video.currentTime = saved;
        } catch(e) {}
      };
      if (video.readyState >= 1) set();
      else video.addEventListener('loadedmetadata', set, {once:true});
    }
  }

  video.addEventListener('timeupdate', saveTime);
  video.addEventListener('pause', saveTime);
  video.addEventListener('loadedmetadata', restoreTime);

  function resume(){
    video.play().then(function(){
      playBtn.style.display = 'none';
    }).catch(function(){
      playBtn.style.display = 'block';
    });
  }

  window.addEventListener('pageshow', function(){
    restoreTime();
  });

  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') {
      restoreTime();
    }
  });

  playBtn.addEventListener('click', function(){
    video.play().then(function(){
      playBtn.style.display = 'none';
    }).catch(function(){});
  });
})();
</script>
</body>
</html>
