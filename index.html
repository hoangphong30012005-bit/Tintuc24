<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trang đọc</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#111}
header{background:#111;color:#fff;padding:18px 16px}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#aaa;font-size:13px}
main{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #0001}
.badge{display:inline-block;background:#111;color:#fff;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700}
h2{font-size:25px;line-height:1.25;margin:12px 0}.content{font-size:17px;line-height:1.65;white-space:pre-wrap}
video{width:100%;display:block;background:#000;border-radius:14px;margin-top:12px;max-height:80vh}
.admin{display:block;text-align:center;color:#666;text-decoration:none;padding:15px}
</style>
</head>
<body>
<header><h1>📰 Tin Tức Đường Phố</h1><p>Trang đọc tin</p></header>
<main>
<section class="card">
<span class="badge">TIN MỚI</span>
<h2 id="title">Tin tức mới nhất</h2>
<div id="content" class="content">Nội dung bài viết của bạn ở đây.</div>
</section>

<section id="v1box" class="card" style="display:none">
<span class="badge">VIDEO 1</span><video id="video1" controls playsinline preload="metadata"></video>
</section>

<section id="v2box" class="card" style="display:none">
<span class="badge">VIDEO 2</span><video id="video2" controls playsinline preload="metadata"></video>
</section>

<a class="admin" href="admin.html">⚙️ Trang quản lý</a>
</main>

<script>
const defaults={title:"Tin tức mới nhất",content:"Nội dung bài viết của bạn ở đây.",video1:"",video2:"",shopee:""};
function getSettings(){
 try{return {...defaults,...JSON.parse(localStorage.getItem("newsSettings")||"{}")}}catch(e){return defaults}
}
function setVideo(id,box,url){
 const v=document.getElementById(id), b=document.getElementById(box);
 if(url){v.src=url;b.style.display="block"}else{v.removeAttribute("src");b.style.display="none"}
}
function load(){
 const s=getSettings();
 document.getElementById("title").textContent=s.title;
 document.getElementById("content").textContent=s.content;
 setVideo("video1","v1box",s.video1);
 setVideo("video2","v2box",s.video2);
}
load();
</script>
</body></html>
