<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Xem trên TikTok</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,sans-serif;background:#151515}
body{min-height:100vh;display:flex;align-items:center;justify-content:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{position:relative;width:min(100%,560px);min-height:360px;background:#fff;border-radius:30px;padding:95px 28px 55px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.close{position:absolute;right:18px;top:18px;width:54px;height:54px;border:0;border-radius:50%;background:#111;color:#fff;font-size:34px;line-height:54px;cursor:pointer}
.title{text-align:center;font-size:25px;font-weight:800;margin:0 0 12px;color:#111}
.sub{text-align:center;color:#666;font-size:15px;line-height:1.5;margin:0 auto 28px;max-width:430px}
.tiktok-btn{display:block;width:100%;padding:22px 18px;border:0;border-radius:28px;background:#111;color:#fff;font-size:28px;font-weight:900;cursor:pointer}
.tiktok-btn:active{transform:scale(.99)}
.hidden{display:none!important}
@media(max-width:480px){.modal{min-height:330px;padding:82px 18px 40px;border-radius:26px}.close{width:48px;height:48px;line-height:48px;font-size:30px}.tiktok-btn{font-size:22px;padding:20px 12px}}
</style>
</head>
<body>
<div class="overlay" id="overlay">
  <section class="modal" role="dialog" aria-label="Xem video trên TikTok">
    <button class="close" type="button" aria-label="Đóng" onclick="closeModal()">×</button>
    <h1 class="title">Xem video trên TikTok</h1>
    <p class="sub">Nhấn nút bên dưới để mở video trực tiếp trong ứng dụng TikTok.</p>
    <button class="tiktok-btn" type="button" onclick="openTikTok()">▶ XEM TRÊN TIKTOK</button>
  </section>
</div>
<script>
const TIKTOK_URL='https://vt.tiktok.com/ZS9BQgahS3qTt-stnQI/';

function closeModal(){
  document.getElementById('overlay').classList.add('hidden');
}

function openTikTok(){
  // Chỉ thử mở ứng dụng TikTok; không có fallback TikTok Web.
  window.location.href='tiktok://open?url='+encodeURIComponent(TIKTOK_URL);
}
</script>
</body>
</html>
