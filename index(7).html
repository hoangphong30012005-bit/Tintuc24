<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tin Tức 24h</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        /* HEADER */
        header {
            background: #fff;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #e60023;
        }

        .subtitle {
            margin-top: 4px;
            font-size: 13px;
            color: #777;
        }

        /* CONTAINER */
        .container {
            max-width: 700px;
            margin: auto;
            padding: 15px;
        }

        /* ARTICLE */
        .article {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .article img {
            width: 100%;
            display: block;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .content {
            padding: 15px;
        }

        .category {
            color: #e60023;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 21px;
            line-height: 1.35;
            margin-bottom: 10px;
        }

        .description {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        /* TIKTOK BUTTON */
        .tiktok-button {
            display: block;
            width: 100%;
            background: #000;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .tiktok-button:active {
            transform: scale(0.98);
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 25px 10px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">TIN TỨC 24H</div>
    <div class="subtitle">Tin mới nhất mỗi ngày</div>
</header>

<main class="container">

    <article class="article">

        <!-- ẢNH BÀI VIẾT -->
        <img
            src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1000&q=80"
            alt="Tin tức"
        >

        <div class="content">

            <div class="category">
                TIN TỨC 24H
            </div>

            <h1>
                Cái vali nhỏ vậy mà cũng nhét được?
            </h1>

            <p class="description">
                Xem video đầy đủ trên TikTok. Bấm nút bên dưới để mở
                trực tiếp bằng ứng dụng TikTok.
            </p>

            <!-- LINK TIKTOK -->
            <a
                class="tiktok-button"
                href="https://vt.tiktok.com/ZS9BsCRKVFqYj-uwxfQ/"
            >
                ▶ MỞ TRÊN TIKTOK
            </a>

        </div>

    </article>

</main>

<footer>
    © 2026 Tin Tức 24h
</footer>

</body>
</html>
